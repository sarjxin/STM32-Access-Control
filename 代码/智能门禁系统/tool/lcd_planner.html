<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ST7735 LCD 界面布局规划器 (127×127)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1e1f24; color: #ddd;
    display: flex; height: 100vh; overflow: hidden;
  }
  /* ===== 左侧画布区 ===== */
  #left {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 12px; overflow: auto;
  }
  /* 画面标签栏 */
  #screenBar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px; max-width: 100%;
  }
  .tab {
    display: flex; align-items: center; gap: 5px;
    background: #2b2c32; border: 1px solid #4a4b52; border-radius: 5px;
    padding: 5px 10px; font-size: 13px; cursor: pointer; user-select: none;
  }
  .tab:hover { background: #3a3b44; }
  .tab.active { background: #2d6cdf; border-color: #5b9bff; color: #fff; }
  .tab .del {
    color: #f88; font-weight: bold; padding: 0 2px; border-radius: 3px;
  }
  .tab .del:hover { background: rgba(255,80,80,.25); }
  .tab .cnt { color: #888; font-size: 11px; }
  .tab.active .cnt { color: #cde; }
  #canvasWrap { position: relative; }
  canvas { background: #000; image-rendering: pixelated; cursor: crosshair;
           box-shadow: 0 0 0 1px #444, 0 4px 20px rgba(0,0,0,.6); }
  #statusbar {
    margin-top: 10px; font-size: 13px; color: #9ab;
    display: flex; gap: 20px; align-items: center;
  }
  #statusbar b { color: #fff; font-family: Consolas, monospace; }
  /* ===== 右侧控制区 ===== */
  #right {
    width: 360px; min-width: 360px; background: #26272c;
    border-left: 1px solid #3a3b40; overflow-y: auto; padding: 12px;
  }
  h2 { font-size: 15px; margin: 14px 0 8px; color: #7ec8ff;
       border-bottom: 1px solid #3a3b40; padding-bottom: 4px; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  label { font-size: 12px; color: #aaa; }
  button, select, input[type=text], input[type=number] {
    background: #33343a; color: #ddd; border: 1px solid #4a4b52;
    border-radius: 4px; padding: 5px 8px; font-size: 12px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { background: #40424a; }
  button.tool { flex: 1 1 30%; }
  button.tool.active { background: #2d6cdf; border-color: #5b9bff; color: #fff; }
  button.danger:hover { background: #a33; }
  input[type=number] { width: 60px; }
  input[type=text] { width: 120px; }
  input[type=color] { width: 36px; height: 26px; border: none; background: none; cursor: pointer; padding: 0; }
  /* 颜色格子 */
  #colorGrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 6px; }
  .swatch { aspect-ratio: 1; border-radius: 3px; cursor: pointer; border: 2px solid transparent; }
  .swatch.sel { border-color: #fff; }
  #colorName { font-size: 12px; color: #8f8; font-family: Consolas, monospace; }
  /* 元素列表 */
  #elemList { max-height: 220px; overflow-y: auto; border: 1px solid #3a3b40; border-radius: 4px; }
  .elem {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    font-size: 12px; cursor: pointer; border-bottom: 1px solid #303138;
    font-family: Consolas, monospace;
  }
  .elem:hover { background: #30323a; }
  .elem.sel { background: #2d4a7a; }
  .elem .idx { color: #777; width: 18px; }
  .elem .info { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .elem button { padding: 1px 6px; font-size: 11px; }
  /* 属性面板 */
  #propPanel { font-size: 12px; }
  #propPanel .row { margin-bottom: 5px; }
  #propPanel label { width: 52px; }
  /* 代码导出 */
  #codeOut {
    width: 100%; height: 260px; background: #141518; color: #b5e853;
    border: 1px solid #3a3b40; border-radius: 4px; font-family: Consolas, monospace;
    font-size: 11px; padding: 8px; resize: vertical; white-space: pre;
  }
  .hint { font-size: 11px; color: #777; line-height: 1.6; }
  kbd { background:#333; border-radius:3px; padding:0 4px; font-size:11px; }
</style>
</head>
<body>

<div id="left">
  <div id="screenBar">
    <div id="screenTabs" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    <button id="addScreenBtn" title="新建一个空白画面">+ 新画面</button>
    <button id="dupScreenBtn" title="把当前画面复制一份再改">⧉ 复制当前</button>
  </div>
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
  <div id="statusbar">
    <span>坐标: <b id="coord">--, --</b></span>
    <span>尺寸: <b id="wh">-- × --</b></span>
    <span id="hintText" class="hint">选择工具后在画布上操作</span>
  </div>
</div>

<div id="right">
  <h2>屏幕设置</h2>
  <div class="row">
    <label>当前画面</label>
    <input type="text" id="scrName" style="flex:1" placeholder="画面名称（如：主菜单）">
  </div>
  <div class="row">
    <label>宽</label><input type="number" id="scrW" value="127" style="width:52px">
    <label>高</label><input type="number" id="scrH" value="127" style="width:52px">
    <label>缩放</label>
    <select id="scaleSel"><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
    <label><input type="checkbox" id="gridChk" checked> 网格</label>
    <label><input type="checkbox" id="snapChk"> 8px对齐</label>
  </div>
  <div class="row">
    <label>本画面底色 LCD_FillColor</label>
    <input type="color" id="bgColor" value="#000000">
    <span id="bgColorName" class="hint">RGB565_BLACK</span>
  </div>

  <h2>绘图工具（对应你的接口函数）</h2>
  <div class="row" id="tools">
    <button class="tool active" data-tool="select">选择/移动</button>
    <button class="tool" data-tool="rect">矩形<br>FillRect</button>
    <button class="tool" data-tool="line">直线<br>DrawLine</button>
    <button class="tool" data-tool="point">点<br>DrawPoint</button>
    <button class="tool" data-tool="text">字符串<br>8x16</button>
    <button class="tool" data-tool="gbk">中文串<br>16x16</button>
    <button class="tool" data-tool="number">数字<br>UInt32</button>
    <button class="tool" data-tool="image">图片占位<br>RGB565</button>
  </div>
  <div class="row">
    <label>前景色</label><input type="color" id="fgColor" value="#ffffff">
    <label>背景色</label><input type="color" id="elBgColor" value="#000000">
    <span id="colorName"></span>
  </div>
  <div id="colorGrid"></div>

  <h2>选中元素属性</h2>
  <div id="propPanel"><span class="hint">未选中元素（用"选择/移动"工具点击画布元素）</span></div>

  <h2>绘制顺序（下层 → 上层，可调整）</h2>
  <div class="row">
    <button id="undoBtn">撤销 (Ctrl+Z)</button>
    <button id="clearBtn" class="danger">清空全部</button>
  </div>
  <div id="elemList"></div>

  <h2>导出 C 代码</h2>
  <div class="row">
    <button id="genBtn">生成代码</button>
    <button id="copyBtn">复制到剪贴板</button>
  </div>
  <textarea id="codeOut" readonly placeholder="点击「生成代码」..."></textarea>
  <p class="hint">
    提示：文本/数字/图片放置后，可在上方"选中元素属性"里修改文字内容、坐标、颜色。
    快捷键：<kbd>Delete</kbd> 删除选中元素，<kbd>Ctrl+Z</kbd> 撤销。
    布局会自动保存在浏览器本地，刷新不丢失。
  </p>
</div>

<script>
/* ================= 颜色表（来自 ST7735.h 的 RGB565 定义） ================= */
const COLORS = [
  ["RGB565_BLACK",0x0000],["RGB565_WHITE",0xFFFF],["RGB565_RED",0xF800],
  ["RGB565_GREEN",0x07E0],["RGB565_BLUE",0x001F],["RGB565_YELLOW",0xFFE0],
  ["RGB565_CYAN",0x07FF],["RGB565_MAGENTA",0xF81F],["RGB565_GRAY",0x8410],
  ["RGB565_DARK_GRAY",0x4208],["RGB565_LIGHT_GRAY",0xC618],["RGB565_DARK_RED",0x8000],
  ["RGB565_MAROON",0x7800],["RGB565_CRIMSON",0xD8A7],["RGB565_SALMON",0xFC0E],
  ["RGB565_CORAL",0xFBEA],["RGB565_LIGHT_PINK",0xFDB8],["RGB565_ORANGE",0xFD20],
  ["RGB565_DARK_ORANGE",0xFC60],["RGB565_GOLD",0xFEA0],["RGB565_KHAKI",0xF731],
  ["RGB565_BEIGE",0xF7BB],["RGB565_DARK_GREEN",0x0320],["RGB565_LIME_GREEN",0x3666],
  ["RGB565_OLIVE",0x8400],["RGB565_FOREST_GREEN",0x2444],["RGB565_SEA_GREEN",0x2C4A],
  ["RGB565_MINT",0x9FF3],["RGB565_DARK_BLUE",0x0010],["RGB565_NAVY",0x000F],
  ["RGB565_SKY_BLUE",0x867D],["RGB565_LIGHT_BLUE",0xAEDC],["RGB565_ROYAL_BLUE",0x435C],
  ["RGB565_STEEL_BLUE",0x4416],["RGB565_TURQUOISE",0x471A],["RGB565_PURPLE",0x8010],
  ["RGB565_VIOLET",0xEC1D],["RGB565_INDIGO",0x4810],["RGB565_ORCHID",0xDB9A],
  ["RGB565_LAVENDER",0xE73F],["RGB565_BROWN",0xA145],["RGB565_DARK_BROWN",0x6182],
  ["RGB565_CHOCOLATE",0xD343],["RGB565_TAN",0xD5B1]
];
function rgb565ToCss(v){
  const r=(v>>11)&31, g=(v>>5)&63, b=v&31;
  const r8=(r<<3)|(r>>2), g8=(g<<2)|(g>>4), b8=(b<<3)|(b>>2);
  return "#"+[r8,g8,b8].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function cssToRgb565(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return ((r>>3)<<11)|((g>>2)<<5)|(b>>3);
}
function colorMacro(v){
  const c = COLORS.find(c=>c[1]===v);
  return c ? c[0] : "0x"+v.toString(16).toUpperCase().padStart(4,"0");
}

/* ================= 状态（多画面） ================= */
let W = 127, H = 127, S = 4;
let tool = "select";
let fg565 = 0xFFFF, elBg565 = 0x0000;
let screens = [];      // [{name, bg565, elems:[], nextId}]
let curIdx = 0;
let selId = null;
let drag = null;       // 拖拽状态
let undoStack = [];
function cur(){ return screens[curIdx]; }
function newScreen(name){
  return { name: name || ("LCD" + (screens.length + 1)), bg565: 0x0000, elems: [], nextId: 1 };
}

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* ================= 初始化 ================= */
function setupCanvas(){
  W = clamp(parseInt(document.getElementById("scrW").value)||127, 1, 240);
  H = clamp(parseInt(document.getElementById("scrH").value)||127, 1, 240);
  S = parseInt(document.getElementById("scaleSel").value);
  cv.width = W*S; cv.height = H*S;
  draw();
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* 颜色格子 */
const grid = document.getElementById("colorGrid");
COLORS.forEach(([name,val])=>{
  const d = document.createElement("div");
  d.className = "swatch"; d.title = name;
  d.style.background = rgb565ToCss(val);
  d.onclick = ()=>{
    fg565 = val;
    document.getElementById("fgColor").value = rgb565ToCss(val);
    showColorName();
  };
  grid.appendChild(d);
});
function showColorName(){
  document.getElementById("colorName").textContent = colorMacro(fg565);
}
showColorName();

/* ================= 事件绑定 ================= */
document.getElementById("scrW").onchange = ()=>{ setupCanvas(); save(); };
document.getElementById("scrH").onchange = ()=>{ setupCanvas(); save(); };
document.getElementById("scaleSel").onchange = setupCanvas;
document.getElementById("gridChk").onchange = draw;
document.getElementById("bgColor").oninput = e=>{
  cur().bg565 = cssToRgb565(e.target.value);
  document.getElementById("bgColorName").textContent = colorMacro(cur().bg565);
  draw(); save();
};
document.getElementById("scrName").oninput = e=>{
  cur().name = e.target.value;
  renderTabs(); save();
};

/* ================= 画面管理 ================= */
function renderTabs(){
  const box = document.getElementById("screenTabs");
  box.innerHTML = "";
  screens.forEach((sc, i)=>{
    const t = document.createElement("div");
    t.className = "tab" + (i===curIdx ? " active" : "");
    t.title = "单击切换画面，双击重命名";
    const label = document.createElement("span");
    label.textContent = `${i+1}. ${sc.name}`;
    const cnt = document.createElement("span");
    cnt.className = "cnt";
    cnt.textContent = `(${sc.elems.length})`;
    t.append(label, cnt);
    if(screens.length > 1){
      const del = document.createElement("span");
      del.className = "del"; del.textContent = "✕"; del.title = "删除此画面";
      del.onclick = e=>{
        e.stopPropagation();
        if(!confirm(`删除画面「${sc.name}」？其中的 ${sc.elems.length} 个元素将一起删除。`)) return;
        pushUndo();
        screens.splice(i, 1);
        if(curIdx >= screens.length) curIdx = screens.length - 1;
        else if(curIdx > i) curIdx--;
        selId = null;
        refreshUI(); save();
      };
      t.append(del);
    }
    t.onclick = ()=>{
      if(i !== curIdx){ curIdx = i; selId = null; refreshUI(); save(); }
    };
    t.ondblclick = ()=>{
      const n = prompt("画面名称（标注这是什么情况下显示的界面）：", sc.name);
      if(n !== null && n.trim()){ pushUndo(); sc.name = n.trim(); refreshUI(); save(); }
    };
    box.appendChild(t);
  });
}
function refreshUI(){
  const sc = cur();
  document.getElementById("scrName").value = sc.name;
  document.getElementById("bgColor").value = rgb565ToCss(sc.bg565);
  document.getElementById("bgColorName").textContent = colorMacro(sc.bg565);
  renderTabs(); renderList(); renderProps(); draw();
}
document.getElementById("addScreenBtn").onclick = ()=>{
  pushUndo();
  screens.push(newScreen());
  curIdx = screens.length - 1; selId = null;
  refreshUI(); save();
};
document.getElementById("dupScreenBtn").onclick = ()=>{
  pushUndo();
  const copy = JSON.parse(JSON.stringify(cur()));
  copy.name = cur().name + " 副本";
  screens.splice(curIdx + 1, 0, copy);
  curIdx++; selId = null;
  refreshUI(); save();
};
document.getElementById("fgColor").oninput = e=>{ fg565 = cssToRgb565(e.target.value); showColorName(); };
document.getElementById("elBgColor").oninput = e=>{ elBg565 = cssToRgb565(e.target.value); };

document.getElementById("tools").addEventListener("click", e=>{
  const btn = e.target.closest("button.tool"); if(!btn) return;
  tool = btn.dataset.tool;
  document.querySelectorAll("button.tool").forEach(b=>b.classList.toggle("active", b===btn));
  const hints = {
    select:"点击元素选中，拖拽移动",
    rect:"拖拽画出矩形 → LCD_FillRect",
    line:"拖拽画出直线 → LCD_DrawLine",
    point:"单击画点 → LCD_DrawPoint",
    text:"单击放置字符串 → LCD_DrawString8x16",
    gbk:"单击放置中文串 → LCD_DrawGBKString16x16",
    number:"单击放置数字 → LCD_DrawUInt32",
    image:"拖拽框出图片区域 → LCD_DrawImageRGB565"
  };
  document.getElementById("hintText").textContent = hints[tool];
});

function snap(v){ return document.getElementById("snapChk").checked ? Math.round(v/8)*8 : v; }
function getPos(e){
  const r = cv.getBoundingClientRect();
  return {
    x: clamp(Math.floor((e.clientX-r.left)/S), 0, W-1),
    y: clamp(Math.floor((e.clientY-r.top)/S), 0, H-1)
  };
}

cv.addEventListener("mousedown", e=>{
  const p = getPos(e);
  pushUndo();
  if(tool==="select"){
    const hit = hitTest(p.x, p.y);
    selId = hit ? hit.id : null;
    if(hit) drag = {mode:"move", el:hit, ox:p.x-hit.x, oy:p.y-hit.y,
                    dx2: hit.type==="line" ? hit.x2-hit.x : 0,
                    dy2: hit.type==="line" ? hit.y2-hit.y : 0};
    renderProps(); renderList(); draw();
  } else if(tool==="rect" || tool==="image"){
    drag = {mode:"draw", x0:snap(p.x), y0:snap(p.y), x1:p.x, y1:p.y};
  } else if(tool==="line"){
    drag = {mode:"draw", x0:snap(p.x), y0:snap(p.y), x1:p.x, y1:p.y};
  } else if(tool==="point"){
    addElem({type:"point", x:p.x, y:p.y, fg:fg565});
  } else if(tool==="text"){
    addElem({type:"text", x:snap(p.x), y:snap(p.y), text:"Text", fg:fg565, bg:elBg565});
  } else if(tool==="gbk"){
    addElem({type:"gbk", x:snap(p.x), y:snap(p.y), text:"中文", fg:fg565, bg:elBg565});
  } else if(tool==="number"){
    addElem({type:"number", x:snap(p.x), y:snap(p.y), value:0, digits:2, fg:fg565, bg:elBg565});
  }
});

cv.addEventListener("mousemove", e=>{
  const p = getPos(e);
  document.getElementById("coord").textContent = p.x+", "+p.y;
  if(drag && drag.mode==="draw"){
    drag.x1=p.x; drag.y1=p.y;
    document.getElementById("wh").textContent =
      (Math.abs(drag.x1-drag.x0)+1)+" × "+(Math.abs(drag.y1-drag.y0)+1);
    draw(drag);
  } else if(drag && drag.mode==="move"){
    const el = drag.el;
    el.x = snap(p.x - drag.ox); el.y = snap(p.y - drag.oy);
    if(el.type==="line"){ el.x2 = el.x + drag.dx2; el.y2 = el.y + drag.dy2; }
    renderProps(); draw();
  } else {
    document.getElementById("wh").textContent = "-- × --";
  }
});

cv.addEventListener("mouseup", e=>{
  if(drag && drag.mode==="draw"){
    const x = Math.min(drag.x0,drag.x1), y = Math.min(drag.y0,drag.y1);
    const w = Math.abs(drag.x1-drag.x0)+1, h = Math.abs(drag.y1-drag.y0)+1;
    if(tool==="rect") addElem({type:"rect", x, y, w, h, fg:fg565});
    else if(tool==="line") addElem({type:"line", x:drag.x0, y:drag.y0, x2:drag.x1, y2:drag.y1, fg:fg565});
    else if(tool==="image") addElem({type:"image", x, y, w, h, name:"my_image"});
    drag = null; draw();
  } else if(drag && drag.mode==="move"){
    drag = null; save();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Delete" && selId!=null && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
    pushUndo();
    cur().elems = cur().elems.filter(el=>el.id!==selId); selId=null;
    renderProps(); renderList(); renderTabs(); draw(); save();
  }
  if(e.key==="z" && e.ctrlKey && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
    undo();
  }
});

function hitTest(x,y){
  const list = cur().elems;
  for(let i=list.length-1;i>=0;i--){
    const el = list[i], b = bbox(el);
    if(x>=b.x && x<b.x+b.w && y>=b.y && y<b.y+b.h) return el;
  }
  return null;
}
function bbox(el){
  switch(el.type){
    case "point": return {x:el.x, y:el.y, w:1, h:1};
    case "rect": case "image": return {x:el.x, y:el.y, w:el.w, h:el.h};
    case "line": return {x:Math.min(el.x,el.x2), y:Math.min(el.y,el.y2),
                         w:Math.abs(el.x2-el.x)+1, h:Math.abs(el.y2-el.y)+1};
    case "text": return {x:el.x, y:el.y, w:(el.text||"").length*8, h:16};
    case "gbk": {
      let w=0; for(const ch of (el.text||"")) w += (ch.charCodeAt(0)>127)?16:8;
      return {x:el.x, y:el.y, w, h:16};
    }
    case "number": return {x:el.x, y:el.y, w:String(el.value).padStart(el.digits,"0").length*8, h:16};
  }
}

/* ================= 元素操作 ================= */
function addElem(o){
  o.id = cur().nextId++;
  cur().elems.push(o);
  selId = o.id;
  renderProps(); renderList(); renderTabs(); draw(); save();
}
function pushUndo(){
  undoStack.push(JSON.stringify({screens, curIdx}));
  if(undoStack.length>50) undoStack.shift();
}
function undo(){
  const s = undoStack.pop(); if(!s) return;
  const o = JSON.parse(s);
  screens = o.screens; curIdx = Math.min(o.curIdx, screens.length-1);
  selId=null; refreshUI(); save();
}
document.getElementById("undoBtn").onclick = undo;
document.getElementById("clearBtn").onclick = ()=>{
  if(!confirm("确定清空当前画面的所有元素？")) return;
  pushUndo(); cur().elems=[]; selId=null; renderProps(); renderList(); renderTabs(); draw(); save();
};

/* ================= 元素列表 ================= */
function elemDesc(el){
  switch(el.type){
    case "rect": return `矩形 (${el.x},${el.y}) ${el.w}×${el.h} ${colorMacro(el.fg)}`;
    case "line": return `直线 (${el.x},${el.y})→(${el.x2},${el.y2}) ${colorMacro(el.fg)}`;
    case "point": return `点 (${el.x},${el.y}) ${colorMacro(el.fg)}`;
    case "text": return `字符串 "${el.text}" (${el.x},${el.y})`;
    case "gbk": return `中文 "${el.text}" (${el.x},${el.y})`;
    case "number": return `数字 ${el.value} 补${el.digits}位 (${el.x},${el.y})`;
    case "image": return `图片 ${el.name} (${el.x},${el.y}) ${el.w}×${el.h}`;
  }
}
function renderList(){
  const box = document.getElementById("elemList");
  box.innerHTML = "";
  const list = cur().elems;
  list.forEach((el,i)=>{
    const d = document.createElement("div");
    d.className = "elem" + (el.id===selId?" sel":"");
    d.innerHTML = `<span class="idx">${i}</span><span class="info">${elemDesc(el)}</span>`;
    const up = document.createElement("button"); up.textContent="↑";
    up.title="上移(后画,盖在上面)";
    up.onclick = e=>{ e.stopPropagation(); if(i<list.length-1){ pushUndo(); [list[i],list[i+1]]=[list[i+1],list[i]]; renderList(); draw(); save(); }};
    const dn = document.createElement("button"); dn.textContent="↓";
    dn.title="下移(先画,被压在下层)";
    dn.onclick = e=>{ e.stopPropagation(); if(i>0){ pushUndo(); [list[i],list[i-1]]=[list[i-1],list[i]]; renderList(); draw(); save(); }};
    const del = document.createElement("button"); del.textContent="✕"; del.className="danger";
    del.onclick = e=>{ e.stopPropagation(); pushUndo(); cur().elems=list.filter(x=>x.id!==el.id); if(selId===el.id)selId=null; renderProps(); renderList(); renderTabs(); draw(); save(); };
    d.append(up,dn,del);
    d.onclick = ()=>{ selId=el.id; renderProps(); renderList(); draw(); };
    box.appendChild(d);
  });
}

/* ================= 属性面板 ================= */
function renderProps(){
  const p = document.getElementById("propPanel");
  const el = cur().elems.find(x=>x.id===selId);
  if(!el){ p.innerHTML = '<span class="hint">未选中元素（用"选择/移动"工具点击画布元素）</span>'; return; }
  let html = "";
  const num = (k,label,v)=>`<div class="row"><label>${label}</label><input type="number" data-k="${k}" value="${v}"></div>`;
  if(el.type==="rect"||el.type==="image"){
    html += num("x","X",el.x)+num("y","Y",el.y)+num("w","宽",el.w)+num("h","高",el.h);
  } else if(el.type==="line"){
    html += num("x","起点X",el.x)+num("y","起点Y",el.y)+num("x2","终点X",el.x2)+num("y2","终点Y",el.y2);
  } else {
    html += num("x","X",el.x)+num("y","Y",el.y);
  }
  if(el.type==="text"||el.type==="gbk")
    html += `<div class="row"><label>文字</label><input type="text" data-k="text" value="${el.text.replace(/"/g,'&quot;')}" style="flex:1"></div>`;
  if(el.type==="number")
    html += num("value","数值",el.value)+num("digits","补位",el.digits);
  if(el.type==="image")
    html += `<div class="row"><label>数组名</label><input type="text" data-k="name" value="${el.name}" style="flex:1"></div>`;
  if(el.fg!==undefined)
    html += `<div class="row"><label>前景色</label><input type="color" data-k="fg" value="${rgb565ToCss(el.fg)}"><span class="hint">${colorMacro(el.fg)}</span></div>`;
  if(el.bg!==undefined)
    html += `<div class="row"><label>背景色</label><input type="color" data-k="bg" value="${rgb565ToCss(el.bg)}"><span class="hint">${colorMacro(el.bg)}</span></div>`;
  p.innerHTML = html;
  p.querySelectorAll("input").forEach(inp=>{
    inp.onchange = ()=>{
      pushUndo();
      const k = inp.dataset.k;
      if(k==="fg"||k==="bg") el[k] = cssToRgb565(inp.value);
      else if(inp.type==="number") el[k] = parseInt(inp.value)||0;
      else el[k] = inp.value;
      renderProps(); renderList(); draw(); save();
    };
  });
}

/* ================= 绘制 ================= */
function draw(preview){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = rgb565ToCss(cur().bg565);
  ctx.fillRect(0,0,cv.width,cv.height);
  cur().elems.forEach(el=>drawElem(el));
  if(preview){
    const x=Math.min(preview.x0,preview.x1), y=Math.min(preview.y0,preview.y1);
    const w=Math.abs(preview.x1-preview.x0)+1, h=Math.abs(preview.y1-preview.y0)+1;
    ctx.save();
    ctx.strokeStyle="#ff0"; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    if(tool==="line"){
      ctx.beginPath();
      ctx.moveTo(preview.x0*S+S/2, preview.y0*S+S/2);
      ctx.lineTo(preview.x1*S+S/2, preview.y1*S+S/2);
      ctx.stroke();
    } else {
      ctx.strokeRect(x*S+.5, y*S+.5, w*S-1, h*S-1);
    }
    ctx.restore();
  }
  // 选中框
  const sel = cur().elems.find(x=>x.id===selId);
  if(sel){
    const b = bbox(sel);
    ctx.save();
    ctx.strokeStyle="#0ff"; ctx.setLineDash([3,3]); ctx.lineWidth=1;
    ctx.strokeRect(b.x*S-.5, b.y*S-.5, b.w*S+1, b.h*S+1);
    ctx.restore();
  }
  // 网格
  if(document.getElementById("gridChk").checked){
    ctx.save();
    for(let x=0;x<=W;x++){
      ctx.strokeStyle = x%8===0 ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.05)";
      ctx.beginPath(); ctx.moveTo(x*S+.5,0); ctx.lineTo(x*S+.5,cv.height); ctx.stroke();
    }
    for(let y=0;y<=H;y++){
      ctx.strokeStyle = y%8===0 ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.05)";
      ctx.beginPath(); ctx.moveTo(0,y*S+.5); ctx.lineTo(cv.width,y*S+.5); ctx.stroke();
    }
    ctx.restore();
  }
}
function drawElem(el){
  switch(el.type){
    case "point":
      ctx.fillStyle = rgb565ToCss(el.fg);
      ctx.fillRect(el.x*S, el.y*S, S, S); break;
    case "rect":
      ctx.fillStyle = rgb565ToCss(el.fg);
      ctx.fillRect(el.x*S, el.y*S, el.w*S, el.h*S); break;
    case "line":
      ctx.strokeStyle = rgb565ToCss(el.fg); ctx.lineWidth = S;
      ctx.beginPath();
      ctx.moveTo(el.x*S+S/2, el.y*S+S/2);
      ctx.lineTo(el.x2*S+S/2, el.y2*S+S/2);
      ctx.stroke(); break;
    case "text": case "number": {
      const txt = el.type==="text" ? el.text : String(el.value).padStart(el.digits,"0");
      const b = bbox(el);
      ctx.fillStyle = rgb565ToCss(el.bg);
      ctx.fillRect(el.x*S, el.y*S, b.w*S, 16*S);
      ctx.fillStyle = rgb565ToCss(el.fg);
      ctx.font = `${13*S}px Consolas, monospace`;
      ctx.textBaseline = "alphabetic";
      ctx.fillText(txt, el.x*S, (el.y+13)*S);
      break;
    }
    case "gbk": {
      const b = bbox(el);
      ctx.fillStyle = rgb565ToCss(el.bg);
      ctx.fillRect(el.x*S, el.y*S, b.w*S, 16*S);
      ctx.fillStyle = rgb565ToCss(el.fg);
      ctx.font = `${13*S}px "Microsoft YaHei", sans-serif`;
      ctx.fillText(el.text, el.x*S, (el.y+13)*S);
      break;
    }
    case "image": {
      ctx.fillStyle = "rgba(120,120,120,.45)";
      ctx.fillRect(el.x*S, el.y*S, el.w*S, el.h*S);
      ctx.strokeStyle = "#aaa"; ctx.lineWidth = 1;
      ctx.strokeRect(el.x*S+.5, el.y*S+.5, el.w*S-1, el.h*S-1);
      ctx.beginPath();
      ctx.moveTo(el.x*S, el.y*S); ctx.lineTo((el.x+el.w)*S, (el.y+el.h)*S);
      ctx.moveTo((el.x+el.w)*S, el.y*S); ctx.lineTo(el.x*S, (el.y+el.h)*S);
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = `${Math.max(10,3*S)}px sans-serif`;
      ctx.fillText(el.name, el.x*S+3, el.y*S+Math.max(12,4*S));
      break;
    }
  }
}

/* ================= 导出 C 代码 ================= */
function pushElemLines(lines, el){
  switch(el.type){
    case "point":
      lines.push(`    LCD_DrawPoint(${el.x}, ${el.y}, ${colorMacro(el.fg)});`); break;
    case "rect":
      lines.push(`    LCD_FillRect(${el.x}, ${el.y}, ${el.w}, ${el.h}, ${colorMacro(el.fg)});`); break;
    case "line":
      lines.push(`    LCD_DrawLine(${el.x}, ${el.y}, ${el.x2}, ${el.y2}, ${colorMacro(el.fg)});`); break;
    case "text":
      lines.push(`    LCD_DrawString8x16(${el.x}, ${el.y}, "${el.text}", ${colorMacro(el.fg)}, ${colorMacro(el.bg)});`); break;
    case "gbk":
      lines.push(`    LCD_DrawGBKString16x16(${el.x}, ${el.y}, "${el.text}", ${colorMacro(el.fg)}, ${colorMacro(el.bg)});`); break;
    case "number":
      lines.push(`    LCD_DrawUInt32(${el.x}, ${el.y}, ${el.value}, ${el.digits}, ${colorMacro(el.fg)}, ${colorMacro(el.bg)});`); break;
    case "image":
      lines.push(`    /* 图片 ${el.name}: ${el.w}x${el.h}, 取模后存入 picture.c 并在 picture.h 中 extern */`);
      lines.push(`    LCD_DrawImageRGB565(${el.x}, ${el.y}, ${el.w}, ${el.h}, ${el.name});`); break;
  }
}
function genCode(){
  const lines = [];
  lines.push("/* ===== LCD 界面布局（由 lcd_planner.html 生成） ===== */");
  lines.push(`/* 屏幕: ${W} x ${H}, 共 ${screens.length} 个画面 */`);
  screens.forEach((sc,i)=>lines.push(`/*   画面 ${i+1}: ${sc.name}  ->  UI_Draw_${i+1}() */`));
  if(screens.some(sc=>sc.elems.some(e=>e.type==="gbk")))
    lines.push("/* 注意: 含中文字符串, 源文件需保存为 GBK 编码 */");
  lines.push("");
  screens.forEach((sc, si)=>{
    lines.push(`/* ---------- 画面 ${si+1}: ${sc.name} ---------- */`);
    lines.push(`void UI_Draw_${si+1}(void)`);
    lines.push("{");
    lines.push(`    LCD_FillColor(${colorMacro(sc.bg565)});`);
    sc.elems.forEach(el=>pushElemLines(lines, el));
    lines.push("}");
    lines.push("");
  });
  return lines.join("\n");
}
document.getElementById("genBtn").onclick = ()=>{
  document.getElementById("codeOut").value = genCode();
};
document.getElementById("copyBtn").onclick = ()=>{
  const ta = document.getElementById("codeOut");
  if(!ta.value) ta.value = genCode();
  ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    document.getElementById("copyBtn").textContent = "已复制 ✓";
    setTimeout(()=>document.getElementById("copyBtn").textContent="复制到剪贴板", 1500);
  });
};

/* ================= 本地保存 ================= */
function save(){
  localStorage.setItem("lcd_planner_v2", JSON.stringify({
    W, H, screens, curIdx
  }));
}
function load(){
  try{
    let o = JSON.parse(localStorage.getItem("lcd_planner_v2"));
    if(!o){
      // 迁移旧版单画面数据
      const old = JSON.parse(localStorage.getItem("lcd_planner"));
      if(old){
        o = { W: old.W, H: old.H, curIdx: 0,
              screens: [{ name: "LCD1", bg565: old.bg565 ?? 0,
                          elems: old.elems || [], nextId: old.nextId || 1 }] };
      }
    }
    if(!o) return;
    document.getElementById("scrW").value = o.W || 127;
    document.getElementById("scrH").value = o.H || 127;
    screens = (o.screens && o.screens.length) ? o.screens : [newScreen()];
    curIdx = Math.min(o.curIdx || 0, screens.length - 1);
  }catch(e){}
}

load();
if(!screens.length) screens.push(newScreen());
setupCanvas();
refreshUI();
</script>
