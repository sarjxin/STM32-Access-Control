<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字模格式转换工具（GBK 码自动补齐）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6f8; color: #1f2329; padding: 24px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #646a73; font-size: 13px; margin-bottom: 16px; }
  .panels { display: flex; gap: 16px; }
  .panel { flex: 1; display: flex; flex-direction: column; }
  .panel label { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%; height: 420px; resize: vertical;
    font-family: Consolas, "Courier New", monospace; font-size: 12px;
    padding: 10px; border: 1px solid #d0d3d6; border-radius: 6px;
    background: #fff; line-height: 1.5; white-space: pre;
  }
  textarea:focus { outline: 2px solid #3370ff; border-color: transparent; }
  .bar { display: flex; align-items: center; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  button {
    padding: 8px 20px; font-size: 14px; border: none; border-radius: 6px;
    cursor: pointer; background: #3370ff; color: #fff;
  }
  button:hover { background: #2860e0; }
  button.ghost { background: #fff; color: #3370ff; border: 1px solid #3370ff; }
  button.ghost:hover { background: #eef3ff; }
  .opt { font-size: 13px; color: #444; display: flex; align-items: center; gap: 4px; }
  #msg, .msg { font-size: 13px; margin-left: auto; }
  #msg.ok, .msg.ok { color: #12934f; }
  #msg.err, .msg.err { color: #d83931; }
  .divider { border-top: 1px solid #e0e2e5; margin: 28px 0 20px; }
  h2 { font-size: 17px; margin-bottom: 4px; }
  input[type=text] {
    padding: 7px 10px; font-size: 13px; border: 1px solid #d0d3d6;
    border-radius: 6px; width: 200px; font-family: Consolas, monospace;
  }
  input[type=text]:focus { outline: 2px solid #3370ff; border-color: transparent; }
  textarea.short { height: 120px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>字模格式转换工具</h1>
  <div class="sub">粘贴带 <code>/*"字",序号*/</code> 注释的字模数组，自动在每个字前补上 GBK 编码行（如 <code>{0xB9U, 0xDCU}, // 管</code>）。</div>

  <div class="bar">
    <button id="btnConvert">转换 →</button>
    <button class="ghost" id="btnCopy">复制结果</button>
    <button class="ghost" id="btnDemo">填入示例</button>
    <button class="ghost" id="btnClear">清空</button>
    <label class="opt"><input type="checkbox" id="chkComment" checked> 保留原注释 /*"字",n*/</label>
    <span id="msg"></span>
  </div>

  <div class="panels">
    <div class="panel">
      <label>输入（原始字模）</label>
      <textarea id="inp" spellcheck="false" placeholder='{0x20,0x40,...},/*"管",0*/&#10;{0x00,0x00,...},/*"理",1*/'></textarea>
    </div>
    <div class="panel">
      <label>输出（带 GBK 码的新格式）</label>
      <textarea id="out" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="divider"></div>

  <h2>功能二：字符串 → GBK 数组</h2>
  <div class="sub">输入任意文字，生成 <code>const uint8_t xxx_GBK[] = { ..., 0x00U };</code>（每个字符一行编码，带注释）。</div>

  <div class="bar">
    <label class="opt">数组名：<input type="text" id="arrName" value="nihao" spellcheck="false"></label>
    <button id="btnGen">生成 →</button>
    <button class="ghost" id="btnCopy2">复制结果</button>
    <span class="msg" id="msg2"></span>
  </div>

  <div class="panels">
    <div class="panel">
      <label>输入（要显示的文字）</label>
      <textarea id="strIn" class="short" spellcheck="false" placeholder="你好"></textarea>
    </div>
    <div class="panel">
      <label>输出（C 数组）</label>
      <textarea id="strOut" class="short" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="divider"></div>

  <h2>功能三：已记录字模库</h2>
  <div class="sub">功能一转换出的新字会<b>自动存入字库</b>（保存在浏览器本地，下次打开还在）；已在字库里的字再次转换时会自动跳过并提醒。字库顶部的 <code>GBK16_FONT_COUNT</code> 随字数自动更新。</div>

  <div class="bar">
    <button class="ghost" id="btnCopyLib">复制字库</button>
    <button class="ghost" id="btnResetLib">恢复默认字库</button>
    <button class="ghost" id="btnClearLib">清空字库</button>
    <span class="msg" id="msg3"></span>
  </div>

  <div class="panels">
    <div class="panel">
      <label>字库内容（数量自动统计）</label>
      <textarea id="libOut" spellcheck="false" readonly></textarea>
    </div>
  </div>
</div>

// 解码 base64 -> Uint16 数组（索引 = Unicode - 0x4E00，值 = GBK 双字节码，0 表示无）
const _raw = Uint8Array.from(atob(CJK_B64), c => c.charCodeAt(0));
const CJK = new Uint16Array(_raw.length / 2);
for (let i = 0; i < CJK.length; i++) CJK[i] = (_raw[i*2] << 8) | _raw[i*2+1];

// 返回 {bytes:[...], ok} —— GBK 编码
function gbkBytes(ch) {
  const cp = ch.codePointAt(0);
  if (cp < 0x80) return [cp];                    // ASCII 单字节
  if (cp >= 0x4E00 && cp <= 0x9FFF) {
    const v = CJK[cp - 0x4E00];
    return v ? [v >> 8, v & 0xFF] : null;
  }
  const v = EXTRA[ch];
  return v ? [v >> 8, v & 0xFF] : null;
}

const hex = b => "0x" + b.toString(16).toUpperCase().padStart(2, "0");

// ===== 解析输入：{字节...} 后跟 /*"字",n*/ =====
function parseInput(text) {
  const re = /\{([^{}]*)\}\s*,?\s*\/\*"([^"]*)"\s*,\s*(\d+)\s*\*\//g;
  const items = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    items.push({ bytes: m[1].trim(), chars: m[2], index: +m[3] });
  }
  return items;
}

function convert() {
  const msg = document.getElementById("msg");
  const keepComment = document.getElementById("chkComment").checked;
  const items = parseInput(document.getElementById("inp").value);
  if (items.length === 0) {
    msg.textContent = "没识别到字模数据，格式应为 {0x..,..},/*\"字\",序号*/";
    msg.className = "err";
    return;
  }
  const entries = loadLibEntries();
  const inLib = new Set(entries.map(e => e.key));
  const unknown = [];
  const newOnes = [];
  const dupOnes = [];
  const blocks = [];
  for (const it of items) {
    if (inLib.has(it.chars)) { dupOnes.push(it.chars); continue; }
    // 注释里通常只有 1 个字；若多个字，逐字生成编码行
    const chars = [...it.chars];
    const lines = chars.map(ch => {
      const bs = gbkBytes(ch);
      if (!bs) { unknown.push(ch); return null; }
      return "{" + bs.map(b => hex(b) + "U").join(", ") + "}, // " + ch;
    }).filter(Boolean);
    let body = lines.join("\n\t") + "\n\t{" + it.bytes + "}";
    if (keepComment) body += "/*\"" + it.chars + "\"," + it.index + "*/";
    const block = "{\n\t" + body + "\n},";
    blocks.push(block);
    entries.push({ key: it.chars, block: block });
    inLib.add(it.chars);
    newOnes.push(it.chars);
  }
  saveLibEntries(entries);
  renderLib();
  document.getElementById("out").value = blocks.join("\n");
  // 提示信息
  const parts = [];
  if (newOnes.length) parts.push("已成功转换\"" + newOnes.join("\"\"") + "\"，已存入字库");
  if (dupOnes.length) parts.push((newOnes.length ? "其中" : "") + "\"" + dupOnes.join("\"\"") + "\"已在字库，已跳过");
  if (unknown.length) parts.push("「" + unknown.join("") + "」无 GBK 编码，已跳过");
  if (!parts.length) parts.push("没有可转换的内容");
  msg.textContent = parts.join("；");
  msg.className = unknown.length ? "err" : "ok";
}

function genGbkArray() {
  const msg = document.getElementById("msg2");
  const text = document.getElementById("strIn").value;
  let name = document.getElementById("arrName").value.trim();
  if (!text) {
    msg.textContent = "请先输入要转换的文字";
    msg.className = "msg err";
    return;
  }
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
    msg.textContent = "数组名不合法（只能字母/数字/下划线，且不以数字开头）";
    msg.className = "msg err";
    return;
  }
  const lines = [];
  const unknown = [];
  let total = 1; // 末尾 0x00U
  for (const ch of text) {
    if (ch === "\r" || ch === "\n") continue;   // 忽略换行
    const bs = gbkBytes(ch);
    if (!bs) { unknown.push(ch); continue; }
    total += bs.length;
    lines.push(bs.map(b => hex(b) + "U").join(", ") + ", /* " + ch + " */");
  }
  const out = "const uint8_t " + name + "_GBK[] =\n{\n\t"
    + lines.join("\n\t") + "\n\t0x00U\n};";
  document.getElementById("strOut").value = out;
  if (unknown.length) {
    msg.textContent = "共 " + total + " 字节；注意：「" + unknown.join("") + "」无 GBK 编码，已跳过";
    msg.className = "msg err";
  } else {
    msg.textContent = "已生成，共 " + total + " 字节 ✓";
    msg.className = "msg ok";
  }
}

// 按块切分：块以单独一行的 "}," 结束
function splitBlocks(text) {
  const blocks = [];
  let cur = [];
  for (const line of text.split("\n")) {
    cur.push(line);
    if (/^\s*\},\s*$/.test(line)) {
      const b = cur.join("\n").trim();
      if (b) blocks.push(b);
      cur = [];
    }
  }
  const rest = cur.join("\n").trim();
  if (rest) blocks.push(rest);
  return blocks;
}

// 从块里提取字符（兼容 /*"理",3*/ 和 /*"理3*/ 两种注释）
function libKeyOf(block) {
  const m = block.match(/\/\*"([^\d",*]+)/);
  return m ? m[1] : null;
}

function loadLibEntries() {
  try {
    const s = localStorage.getItem(LIB_KEY);
    if (s) {
      const arr = JSON.parse(s);
      if (Array.isArray(arr)) return arr;
    }
  } catch (e) {}
  // 首次使用：种入默认字库
  const entries = [];
  for (const b of splitBlocks(DEFAULT_LIB_TEXT)) {
    const k = libKeyOf(b);
    if (k) entries.push({ key: k, block: b });
  }
  saveLibEntries(entries);
  return entries;
}

function saveLibEntries(entries) {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(entries)); } catch (e) {}
}

function renderLib() {
  const entries = loadLibEntries();
  document.getElementById("libOut").value =
    "#define GBK16_FONT_COUNT  " + entries.length + "U\n\n"
    + entries.map(e => e.block).join("\n");
}

document.getElementById("btnCopyLib").onclick = () => {
  const out = document.getElementById("libOut");
  if (!out.value) return;
  navigator.clipboard.writeText(out.value).then(() => {
    const msg = document.getElementById("msg3");
    msg.textContent = "字库已复制到剪贴板 ✓";
    msg.className = "msg ok";
  });
};
document.getElementById("btnResetLib").onclick = () => {
  if (!confirm("恢复默认字库？你在默认基础上新加的字会被清除。")) return;
  localStorage.removeItem(LIB_KEY);
  renderLib();
  const msg = document.getElementById("msg3");
  msg.textContent = "已恢复默认字库（28 字）";
  msg.className = "msg ok";
};
document.getElementById("btnClearLib").onclick = () => {
  if (!confirm("确定清空整个字库？此操作不可恢复。")) return;
  saveLibEntries([]);
  renderLib();
  const msg = document.getElementById("msg3");
  msg.textContent = "字库已清空";
  msg.className = "msg ok";
};

renderLib();
